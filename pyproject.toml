[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsguard"
dynamic = ["version"]
description = "Shared parts of a documentation guard: pages, mirrored blocks, short annotations, and a runner that answers with an exit code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "docsguard contributors" }]
keywords = ["documentation", "guard", "ci", "markdown", "docs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Source = "https://github.com/keyfire/docsguard"

[tool.setuptools]
packages = ["docsguard"]

[tool.setuptools.dynamic]
version = { attr = "docsguard.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
