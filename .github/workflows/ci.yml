name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  # The package is installed from git, so what CI has to prove is exactly that: a clean
  # environment, the URL a consumer writes, and the import that consumer makes.
  install-from-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the checkout the way a consumer installs from git
        run: pip install "git+file://${GITHUB_WORKSPACE}"
      - name: Import
        run: python -c "import docsguard; print(docsguard.__version__)"
